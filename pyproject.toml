[project]
name = "lq45"
version = "0.1.0"
description = "NeuralAlpha: Two-stage portfolio optimization with self-supervised MAE pre-training and CNN-BiLSTM preselection for LQ45 equities"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.14",
    "scikit-learn>=1.9",
    "pandas>=3.0",
    "numpy>=2.5",
    "scipy>=1.18",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "requests>=2.31",
    "yfinance>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Scripts and tests put src/ on sys.path before importing lq45, so imports
# necessarily follow that call.
"tests/*" = ["E402"]
"scripts/*" = ["E402"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.coverage.run]
source = ["src/lq45"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]