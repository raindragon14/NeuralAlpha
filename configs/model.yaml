# Decision log: docs/keputusan_desain.md

device: auto  # "auto" -> CUDA if available, otherwise CPU

lookback_days: 60   # w: own decision, tested for window sensitivity
horizon_days: 5     # tau: own decision, tested for window sensitivity

cnn:
  filters: [32, 64]    # Espiga-Fernandez et al. (2024) Table 3
  kernel_size: 3       # Chaweewanchon & Chaysiri (2022)
  activation: relu     # Espiga-Fernandez et al. (2024) Table 3
  batchnorm: true      # Chaweewanchon & Chaysiri (2022)
  pooling:
    size: 2            # own decision (the paper does not set a value)

bilstm:
  units: 64            # tuned on the design period
  layers: 2            # Graves, Mohamed & Hinton (2013); Chaweewanchon & Chaysiri (2022); Sebastian & Tantia (2024)
  bidirectional: true

dropout:
  cnn: 0.2   # Sebastian & Tantia (2024); tuned on the design period
  lstm: 0.2  # Sebastian & Tantia (2024); tuned on the design period
  dense: 0.2 # Sebastian & Tantia (2024); tuned on the design period

optimizer:
  lr: 0.0001       # Chaweewanchon & Chaysiri (2022) Section 4.1.3
  weight_decay: 0.0  # tuned on the design period (0 vs 1e-4)

epochs: 100      # Chaweewanchon & Chaysiri (2022); Sebastian & Tantia (2024)

early_stopping:
  patience: 8    # Sebastian & Tantia (2024)

batch_size: 32   # default sebelum tuning; best_hyperparams.yaml overrides (batch 64)

tuning:
  train: "2018-01-01/2018-12-31"
  validate: "2019-01-01/2019-12-31"
  grid:
    bilstm.units: [32, 64, 128]
    batch_size: [32, 64]
    optimizer.weight_decay: [0.0, 0.0001]
    pooling.size: [2, 3]

sensitivity:
  lookback_days: [30, 60, 120]
  horizon_days: [1, 5, 21]

# Masked Autoencoder Pre-training (self-supervised)
# Reference: PatchTST (Nie et al. 2022), TimeMAE (Cheng et al. 2023), MTSMAE (Tang & Zhang 2022)
# Input = the supervised FEATURE_COLUMNS panel, so the encoder transfers unchanged.
pretrain:
  enabled: true
  data_end: "2019-12-31"     # pre-train sees nothing after the design period
  mask_ratio: 0.3            # MAE standard (He et al. 2022)
  epochs: 50
  lr: 0.001
  weight_decay: 0.0
  batch_size: 64
  patience: 10
  val_ratio: 0.1             # 10% for reconstruction validation
  decoder:
    hidden: 128
    layers: 2
  fine_tune:
    freeze_encoder: false    # full fine-tune with discriminative LR
    head_lr: 0.0001          # projection head LR
    encoder_lr: 0.00001      # encoder LR (10x smaller)
