selection:
  k_values: [5, 7, 10]           # main RQ2 grid
  k_sensitivity: [3, 15, 20]     # extension of the Sharpe vs k curve

covariance:
  lookback_days: 120
  lookback_sensitivity: [60, 252]
  estimators: [sample, ridge_epsilon, ledoit_wolf, gmv]
  ridge_epsilon: 0.0001

constraints:
  max_weight: 0.35               # own decision; sensitivity-tested
  max_weight_sensitivity: [0.25, 0.50, 1.0]

optimization:
  types: ["target_return"]

rebalance_days: 21
execution_lag_days: 1        # trade N trading days after the signal date (Kim et al. 2025 use 2)
