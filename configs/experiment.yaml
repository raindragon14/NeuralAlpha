# Full decision log: docs/DECISIONS.md
#
# Final features (Option 2), 8 in total. Citation for each feature:
#   close, volume : Sebastian & Tantia (2024); Sen & Dutta (2021)      [B1, B2]
#   rsi(14)       : Espiga-Fernandez et al. (2024) Appendix B.3        [B3]
#   cci(20)       : Espiga-Fernandez et al. (2024) Appendix B.4        [B4]
#   cmo(14)       : Espiga-Fernandez et al. (2024) Appendix B.5        [B5]
#   mfi(14)       : Espiga-Fernandez et al. (2024) Appendix B.6        [B6]
#   bi_7drrr      : extension (gap in Chaweewanchon & Chaysiri 2022)   [B8]
#   jisdor        : extension (same as above)                          [B9]
# AROONOSC, Williams %R and STOCHF are dropped to keep 8 features.     [B7]

features:
  indicators:
    rsi: 14
    cci: 20
    cmo: 14
    mfi: 14
  macro_transform:
    bi_7drrr: level      # B8: changes monthly only; differences are almost always zero
    jisdor: log_return   # B9: non-stationary level

evaluation:
  # E9: 252-day convention. IDX is empirically ~242 days/year; tested in the sensitivity analysis.
  annualization: 252

# OOS starts in 2020 (initial train of 2 years)
regimes:
  design_calm:        {start: "2018-01-01", end: "2019-12-31", oos: false}
  covid:              {start: "2020-01-01", end: "2020-12-31", oos: true}
  recovery_rate_hike: {start: "2021-01-01", end: "2025-12-31", oos: true}
