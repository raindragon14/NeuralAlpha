# Nested walk-forward: validation is out-of-sample immediately before the test.
# Initial train is 2 years (2018-2019) -> TEST starts Jan 2020 (covers COVID).
initial_train_years: 2
validation_days: 63              # ~3 months, early stopping + selection
test_days: 21                    # 1 month, final evaluation
step_days: 21                    # shift every month

purge:
  horizon_days: 5                # tau: drop training labels that fall inside validation
embargo_days: 59                 # w-1
